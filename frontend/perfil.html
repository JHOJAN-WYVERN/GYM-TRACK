<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTrack — Perfil</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h2>Perfil del deportista</h2>
        <p>Tu información de cuenta.</p>
      </div>
    </div>

    <div class="card" style="max-width:420px;">
      <div class="field">
        <label for="nombrePerfil">Nombre completo</label>
        <input type="text" id="nombrePerfil">
      </div>
      <div class="field">
        <label for="correoPerfil">Correo</label>
        <input type="email" id="correoPerfil" disabled>
      </div>
      <button class="btn btn-primary" id="btnGuardarPerfil">Guardar cambios</button>
      <p id="confirmacion" style="display:none; color:var(--leaf); font-size:0.85rem; margin-top:10px;">✓ Cambios guardados.</p>
    </div>

    <div class="card" style="max-width:420px; margin-top:18px;">
      <h3 style="font-size:1rem; margin-bottom:10px;">Resumen de tu cuenta</h3>
      <div id="resumenCuenta"></div>
    </div>
  </main>
</div>

<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script>
  const usuario = requireAuth();

  if (usuario) {
    renderSidebar('perfil.html');

    document.getElementById('nombrePerfil').value = usuario.nombre;
    document.getElementById('correoPerfil').value = usuario.correo;

    document.getElementById('btnGuardarPerfil').addEventListener('click', () => {
      const nombre = document.getElementById('nombrePerfil').value.trim();
      if (!nombre) { alert('El nombre no puede quedar vacío.'); return; }
      DB.actualizarPerfil(usuario.id_usuario, { nombre });
      const conf = document.getElementById('confirmacion');
      conf.style.display = 'block';
      setTimeout(() => conf.style.display = 'none', 2000);
      renderSidebar('perfil.html');
    });

    const stats = DB.getEstadisticas(usuario.id_usuario);
    const rutinas = DB.getRutinas(usuario.id_usuario);
    const metas = DB.getMetas(usuario.id_usuario);

    document.getElementById('resumenCuenta').innerHTML = `
      <div class="list-item"><span>Rutinas creadas</span><strong>${rutinas.length}</strong></div>
      <div class="list-item"><span>Entrenamientos completados</span><strong>${stats.entrenamientosRealizados}</strong></div>
      <div class="list-item"><span>Metas activas</span><strong>${metas.filter(m => m.progreso < 100).length}</strong></div>
      <div class="list-item"><span>Elementos dominados</span><strong>${stats.elementosDominados}</strong></div>
    `;
  }
</script>
</body>
</html>
